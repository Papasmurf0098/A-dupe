<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#090a0c" />
  <meta name="description" content="Nightcap Library — a tasting-first reference for whiskey, wine, spirits, cocktails, beer, and more." />
  <title>Nightcap Library</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body data-family="All">
  <div class="ambient" aria-hidden="true">
    <div class="ambient__wash ambient__wash--a"></div>
    <div class="ambient__wash ambient__wash--b"></div>
    <div class="ambient__grain"></div>
  </div>

  <div id="app" class="app-shell" aria-live="polite">
    <div class="boot-screen">
      <div class="boot-mark">N</div>
      <p>Opening the library…</p>
    </div>
  </div>

  <noscript>Nightcap Library requires JavaScript to browse the local catalog.</noscript>
  <script type="module" src="js/app.js"></script>
</body>
</html>
